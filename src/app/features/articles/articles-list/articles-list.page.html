  <!-- <ion-searchbar class="Rechercher-bar" placeholder="Rechercher un article..." animated></ion-searchbar> -->

  <ion-list lines="none">
  <ion-item-sliding *ngFor="let article of filteredArticles">

    <ion-item button lines="none"  (click)="detailleArticle(article.id)" class="article-item">

      <ion-label>
        <div class="article-header">
          <ion-badge [ngClass]="article.statut">
            {{ article.statut }}
          </ion-badge>
        </div>

        <h2 class="article-title">{{ article.titre }}</h2>
        <p class="article-date">
          {{ article.dateCreation | date:'dd/MM/yyyy' }}
        </p>
        
      </ion-label>

     
    </ion-item>
  </ion-item-sliding>
</ion-list>
 <div style="height: 80px"></div>
</ion-content>

<ion-fab class="button-flottant-add">
  <ion-fab-button class="button-flottant" routerLink="/redaction">

</ion-fab>
