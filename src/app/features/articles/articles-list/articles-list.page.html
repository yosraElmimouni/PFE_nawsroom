  <ion-segment class="filter-bar" [(ngModel)]="filter" scrollable>
    
    <ion-segment-button value="all">Tous</ion-segment-button>
    <ion-segment-button value="published">Publiés</ion-segment-button>
    <ion-segment-button value="draft">Brouillons</ion-segment-button>
    <ion-segment-button value="review">En révision</ion-segment-button>
  </ion-segment>

  <ion-searchbar class="Rechercher-bar" placeholder="Rechercher un article..." animated></ion-searchbar>

  <ion-list lines="none">
  <ion-item-sliding *ngFor="let article of filteredArticles">

    <ion-item button lines="none"  (click)="detailleArticle(article.id)" class="article-item">
      <div class="status-bar" [ngClass]="article.status" slot="start"></div>

      <ion-label>
        <div class="article-header">
          <ion-badge [ngClass]="article.badgeColor">
            {{ article.badgeLabel }}
          </ion-badge>
        </div>

        <h2 class="article-title">{{ article.title }}</h2>
        <p class="article-excerpt">{{ article.excerpt }}</p>

        <!-- <div class="article-footer">
          <span class="article-meta">
            <ion-icon [name]="article.metaIcon"></ion-icon>
            {{ article.metaText }}
          </span>
        </div> -->
      </ion-label>

      <ion-avatar slot="end" >
        <ion-img
          class="article-img"
          [src]="article.image">
        </ion-img>
      </ion-avatar>
    </ion-item>

    <ion-item-options side="end">
      <ion-item-option >
        <ion-icon slot="icon-only" name="create-outline"></ion-icon>
      </ion-item-option>
      <ion-item-option >
        <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
      </ion-item-option>
    </ion-item-options>

  </ion-item-sliding>
</ion-list>

</ion-content>

<ion-fab class="button-flottant-add">
  <ion-fab-button class="button-flottant" routerLink="/redaction">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>
