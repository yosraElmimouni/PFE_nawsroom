<ion-header [translucent]="true">
  <ion-toolbar class="toolbar">
    <ion-title class="title-toolbar">Infos média</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/dashboard"></ion-back-button>
    </ion-buttons>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon  name="send-outline" slot="start"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="content-page" [fullscreen]="true">
  <div class="section-block">
    <ion-label class="article-titlee">Métadonnées</ion-label>

    <ion-list lines="none" class="meta-form">
      <ion-item>
        <ion-label class="section-label" position="stacked"
          >Titre du média</ion-label
        >
        <ion-input placeholder="Ex: Manifestation place centrale"> </ion-input>
      </ion-item>

      <ion-item>
        <ion-label class="section-label" position="stacked"
          >Description</ion-label
        >
        <ion-textarea
          placeholder="Décrivez le contexte de ce média..."
          rows="3"
        ></ion-textarea>
      </ion-item>

      <ion-item>
        <ion-label class="section-label" position="stacked"
          >Localisation</ion-label
        >
        <ion-input placeholder="Ex: Casablanca, Maroc"> </ion-input>
        <ion-button slot="end" fill="clear" (click)="getLocation()">
          <ion-icon color="dark" name="locate-outline"></ion-icon>
        </ion-button>
      </ion-item>

      <ion-item>
        <ion-label class="section-label" position="stacked"
          >Capturer un contenu</ion-label
        >
        <div class="capture-grid">
            <button  *ngIf="name==='photo'" class="capture-btn photo">
              <ion-icon name="camera-outline"></ion-icon>
              <span>Photo</span>
            </button>

            <button *ngIf="name==='vidio'" class="capture-btn video">
              <ion-icon name="videocam-outline"></ion-icon>
              <span>Vidéo</span>
            </button>

            <button *ngIf="name==='audio'" class="capture-btn audio">
              <ion-icon name="mic-outline"></ion-icon>
              <span>Audio</span>
            </button>

            <!-- <button class="capture-btn file" (click)="pickFile()">
        <ion-icon name="document-attach-outline"></ion-icon>
        <span>Fichier</span>
      </button> -->
          </div>
      </ion-item>

      <ion-item *ngIf="!linkedArticle" button (click)="openArticleSelector()">
        <ion-label class="section-label" position="stacked"
          >Associer à un article
          </ion-label>
        <ion-button
  fill="solid"
  class="icon-link"
>
  <ion-icon name="link-outline"></ion-icon>
</ion-button>
      </ion-item>

      <ion-modal class="modal-article" [isOpen]="showArticleSelector">
        <ng-template>
          <ion-header class="modal-header">
            <ion-toolbar>
              <ion-title class="section-label" class="title-modal"
                >Choisir un article</ion-title
              >

              <ion-buttons slot="end">
                <ion-button
                  class="btn-close"
                  fill="clear"
                  (click)="closeArticleSelector()"
                >
                  <ion-icon name="close-circle-outline"></ion-icon>
                </ion-button>
              </ion-buttons>
            </ion-toolbar>
          </ion-header>

          <ion-content>
            <ion-list>
              <ion-item
                class="article-item"
                button
                *ngFor="let article of articles"
                (click)="selectArticle(article)"
              >
                <ion-label>{{ article.title }}</ion-label>
                <ion-icon slot="end" name="chevron-forward-outline"></ion-icon>
              </ion-item>
            </ion-list>
          </ion-content>
        </ng-template>
      </ion-modal>

      <ion-item>
        <ion-card *ngIf="linkedArticle" class="associated-article">
          <ion-card-header>
            <ion-card-title class="article-title"
              >{{ linkedArticle.title }}</ion-card-title
            >
          </ion-card-header>
        </ion-card>
      </ion-item>
